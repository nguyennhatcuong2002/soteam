<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trợ lý Báo Cáo Vận Hành</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --user-bubble: #2563eb;
    --bot-bubble: #eef2f7;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #dc2626;
    --sidebar-bg: #111827;
    --sidebar-text: #e5e7eb;
    --sidebar-hover: #1f2937;
    --sidebar-active: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .layout { display: flex; height: 100vh; }

  /* ----- Sidebar ----- */
  .sidebar {
    width: 270px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.25s ease;
  }
  .sidebar-head { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .new-btn {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .new-btn:hover { background: var(--primary-dark); }
  .sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #9ca3af; padding: 14px 14px 6px; }
  .convo-list { flex: 1; overflow-y: auto; padding: 0 8px 14px; }
  .convo-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--sidebar-text);
    margin-bottom: 2px;
  }
  .convo-item:hover { background: var(--sidebar-hover); }
  .convo-item.active { background: var(--sidebar-active); color: #fff; }
  .convo-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convo-item .del {
    opacity: 0; border: none; background: transparent; color: inherit;
    cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 6px;
  }
  .convo-item:hover .del, .convo-item.active .del { opacity: 0.75; }
  .convo-item .del:hover { opacity: 1; background: rgba(255,255,255,0.15); }
  .empty-hint { color: #9ca3af; font-size: 12.5px; padding: 10px 14px; }

  /* ----- Main app ----- */
  .app {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  header {
    padding: 14px 20px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    display: flex; align-items: center; gap: 12px;
  }
  .menu-btn { display: none; background: rgba(255,255,255,0.18); border: none; color: #fff; font-size: 18px; border-radius: 8px; width: 38px; height: 38px; cursor: pointer; }
  header .titles { flex: 1; min-width: 0; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 3px 0 0; font-size: 13px; opacity: 0.9; }
  .status { font-size: 12px; margin-top: 5px; opacity: 0.85; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; margin-right: 5px; vertical-align: middle; }
  .status.ok .dot { background: #22c55e; }
  .status.err .dot { background: #ef4444; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 80%; padding: 11px 14px; border-radius: 14px;
    font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
  }
  .row.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .row.bot .bubble { background: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .bubble.error { background: #fee2e2; color: var(--danger); }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .bubble th { background: rgba(0,0,0,0.04); }
  .bubble p { margin: 6px 0; }
  .bubble code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  .quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 20px 0; }
  .quick button { border: 1px solid var(--border); background: #fff; color: var(--primary); border-radius: 20px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .quick button:hover { background: #eff6ff; }

  footer { padding: 12px 20px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; font-size: 14.5px; font-family: inherit; line-height: 1.5; max-height: 160px; outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  .send-btn { background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 0 20px; height: 44px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .toolbar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 8px; }
  .toolbar .hint { font-size: 12px; color: var(--muted); }

  .backdrop { display: none; }

  /* ----- Responsive ----- */
  @media (max-width: 720px) {
    .sidebar { position: fixed; z-index: 30; height: 100%; margin-left: -270px; box-shadow: 2px 0 16px rgba(0,0,0,0.3); }
    .layout.menu-open .sidebar { margin-left: 0; }
    .menu-btn { display: block; }
    .layout.menu-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 20; }
  }
</style>
</head>
<body>
<div class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="new-btn" id="newBtn">＋ Cuộc hội thoại mới</button>
    </div>
    <div class="sidebar-title">Lịch sử hội thoại</div>
    <div class="convo-list" id="convoList"></div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <div class="app">
    <header>
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="titles">
        <h1>🤖 Trợ lý Báo Cáo Vận Hành</h1>
        <p>Trợ lý báo cáo ngày, tuần, tháng... cho nhóm vận hành</p>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">Đang kiểm tra kết nối…</span></div>
      </div>
    </header>

    <div id="messages"></div>

    <div class="quick">
      <button data-prompt="Báo cáo hôm nay">📋 Báo cáo hôm nay</button>
      <button data-prompt="Báo cáo tuần này">📊 Báo cáo tuần</button>
      <button data-prompt="Bạn có thể giúp tôi những gì?">❓ Hướng dẫn</button>
    </div>

    <footer>
      <div class="toolbar">
        <span class="hint">Enter để gửi · Shift+Enter để xuống dòng</span>
      </div>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Nhập tin nhắn, dán dữ liệu task, hoặc dán link Google Sheets (công khai)…"></textarea>
        <button class="send-btn" id="sendBtn">Gửi</button>
      </div>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const ENDPOINT = "https://endpoint-a2e9ba08-56ff-4c4f-9a5f-70490afdb8fa.agentbase-runtime.aiplatform.vngcloud.vn";
  const LS_KEY = "tbcvh_chat_v1";

  // ---- DOM refs ----
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const newBtn = document.getElementById("newBtn");
  const convoListEl = document.getElementById("convoList");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const layoutEl = document.getElementById("layout");
  const menuBtn = document.getElementById("menuBtn");
  const backdrop = document.getElementById("backdrop");

  // ---- State (persisted to localStorage) ----
  // store = { conversations: [{id, title, messages:[{role,content}]}], activeId }
  let store = { conversations: [], activeId: null };
  let busy = false;

  function uid() {
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function loadStore() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.conversations)) store = parsed;
      }
    } catch (e) { /* ignore corrupt storage */ }
  }
  function saveStore() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
  }
  function activeConvo() {
    return store.conversations.find((c) => c.id === store.activeId) || null;
  }

  // ---- Conversation management ----
  function createConversation(makeActive = true) {
    const convo = { id: uid(), title: "Cuộc hội thoại mới", messages: [] };
    store.conversations.unshift(convo); // newest on top
    if (makeActive) store.activeId = convo.id;
    saveStore();
    return convo;
  }
  function deleteConversation(id) {
    const idx = store.conversations.findIndex((c) => c.id === id);
    if (idx === -1) return;
    const wasActive = store.conversations[idx].id === store.activeId;
    store.conversations.splice(idx, 1);
    if (wasActive) {
      store.activeId = store.conversations.length ? store.conversations[0].id : null;
    }
    if (!store.conversations.length) createConversation(true);
    saveStore();
    renderSidebar();
    renderMessages();
  }
  function switchTo(id) {
    if (store.activeId === id) { closeMenu(); return; }
    store.activeId = id;
    saveStore();
    renderSidebar();
    renderMessages();
    closeMenu();
    inputEl.focus();
  }

  function titleFromText(text) {
    const t = text.trim().replace(/\s+/g, " ");
    return t.length > 38 ? t.slice(0, 38) + "…" : t;
  }

  // ---- Rendering: sidebar ----
  function renderSidebar() {
    convoListEl.innerHTML = "";
    if (!store.conversations.length) {
      convoListEl.innerHTML = '<div class="empty-hint">Chưa có cuộc hội thoại nào.</div>';
      return;
    }
    store.conversations.forEach((c) => {
      const item = document.createElement("div");
      item.className = "convo-item" + (c.id === store.activeId ? " active" : "");
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = c.title || "Cuộc hội thoại mới";
      const del = document.createElement("button");
      del.className = "del";
      del.title = "Xóa cuộc hội thoại";
      del.textContent = "🗑";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        if (confirm('Xóa cuộc hội thoại "' + (c.title || "mới") + '"?')) {
          deleteConversation(c.id);
        }
      });
      item.appendChild(name);
      item.appendChild(del);
      item.addEventListener("click", () => switchTo(c.id));
      convoListEl.appendChild(item);
    });
  }

  // ---- Rendering: messages ----
  function renderContent(text, isBot) {
    if (isBot && window.marked) {
      try { return marked.parse(text); } catch (e) {}
    }
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
  function appendBubble(text, who, opts = {}) {
    const row = document.createElement("div");
    row.className = "row " + (who === "user" ? "user" : "bot");
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (opts.error ? " error" : "");
    bubble.innerHTML = renderContent(text, who === "bot");
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }
  function greetingHTML() {
    return (
      "Xin chào! 👋 Tôi là Trợ lý Báo Cáo Vận Hành.\n\n" +
      "Bạn có thể:\n" +
      "• Dán dữ liệu task — hoặc dán **link Google Sheets công khai**, tôi tự đọc dữ liệu\n" +
      "• Bấm **📋 Báo cáo hôm nay** hoặc **📊 Báo cáo tuần**\n" +
      "• Hỏi *\"PIC [tên]\"* để xem task của một người\n\n" +
      "Tôi cần hỗ trợ gì cho bạn hôm nay?"
    );
  }
  function renderMessages() {
    messagesEl.innerHTML = "";
    const convo = activeConvo();
    if (!convo || convo.messages.length === 0) {
      appendBubble(greetingHTML(), "bot");
      return;
    }
    convo.messages.forEach((m) => appendBubble(m.content, m.role === "user" ? "user" : "bot"));
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "typingRow";
    row.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function removeTyping() {
    const r = document.getElementById("typingRow");
    if (r) r.remove();
  }

  // ---- Sending ----
  async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;

    let convo = activeConvo();
    if (!convo) convo = createConversation(true);

    // Auto-title from the first user message
    const isFirst = convo.messages.length === 0;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    autoGrow();

    // If we were showing the greeting (no messages yet), clear it before first bubble
    if (isFirst) messagesEl.innerHTML = "";

    appendBubble(text, "user");
    addTyping();

    // Build context history from the active conversation BEFORE adding this turn
    const contextHistory = convo.messages.slice(-12);

    // Persist the user turn now
    convo.messages.push({ role: "user", content: text });
    if (isFirst) convo.title = titleFromText(text);
    saveStore();
    renderSidebar();

    try {
      const res = await fetch(ENDPOINT + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: contextHistory }),
      });
      removeTyping();

      if (!res.ok) {
        let detail = "Lỗi máy chủ (HTTP " + res.status + ")";
        try { const j = await res.json(); if (j.detail) detail = j.detail; } catch (e) {}
        appendBubble("⚠️ " + detail, "bot", { error: true });
        return;
      }

      const data = await res.json();
      const reply = (data.reply || "").trim() || "(không có nội dung trả về)";
      appendBubble(reply, "bot");
      convo.messages.push({ role: "assistant", content: reply });
      saveStore();
    } catch (err) {
      removeTyping();
      appendBubble(
        "⚠️ Không kết nối được tới agent. Kiểm tra mạng hoặc endpoint.\n(" + err.message + ")",
        "bot",
        { error: true }
      );
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ---- Health check ----
  async function checkHealth() {
    try {
      const res = await fetch(ENDPOINT + "/health");
      if (!res.ok) throw new Error("status " + res.status);
      statusEl.className = "status ok";
      statusText.textContent = "Đã kết nối · sẵn sàng";
    } catch (e) {
      statusEl.className = "status err";
      statusText.textContent = "Không kết nối được tới agent";
    }
  }

  // ---- UI wiring ----
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  }
  function openMenu() { layoutEl.classList.add("menu-open"); }
  function closeMenu() { layoutEl.classList.remove("menu-open"); }

  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(inputEl.value); }
  });
  sendBtn.addEventListener("click", () => send(inputEl.value));
  newBtn.addEventListener("click", () => {
    // Reuse an existing empty "new" conversation instead of stacking blanks
    const active = activeConvo();
    if (active && active.messages.length === 0) { closeMenu(); inputEl.focus(); return; }
    createConversation(true);
    renderSidebar();
    renderMessages();
    closeMenu();
    inputEl.focus();
  });
  menuBtn.addEventListener("click", () => layoutEl.classList.toggle("menu-open"));
  backdrop.addEventListener("click", closeMenu);
  document.querySelectorAll(".quick button").forEach((b) => {
    b.addEventListener("click", () => send(b.dataset.prompt));
  });

  // ---- Init ----
  loadStore();
  if (!store.conversations.length) {
    createConversation(true);
  } else if (!activeConvo()) {
    store.activeId = store.conversations[0].id;
    saveStore();
  }
  renderSidebar();
  renderMessages();
  checkHealth();
  inputEl.focus();
</script>
</body>
</html>
