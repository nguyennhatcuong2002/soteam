<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SO Task Intelligence Agent — Chat</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --user-bubble: #2563eb;
    --bot-bubble: #eef2f7;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 860px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }
  header {
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
  }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
  .status { font-size: 12px; margin-top: 6px; opacity: 0.85; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; margin-right: 5px; vertical-align: middle; }
  .status.ok .dot { background: #22c55e; }
  .status.err .dot { background: #ef4444; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .bubble.error { background: #fee2e2; color: var(--danger); }
  /* Rendered markdown tidy-ups */
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .bubble th { background: rgba(0,0,0,0.04); }
  .bubble p { margin: 6px 0; }
  .bubble code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  .quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 20px 0; }
  .quick button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--primary);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .quick button:hover { background: #eff6ff; }

  footer {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 160px;
    outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  .send-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    height: 44px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .toolbar .hint { font-size: 12px; color: var(--muted); }
  .clear-btn { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🤖 SO Task Intelligence Agent</h1>
    <p>Trợ lý phân tích task &amp; báo cáo cho team Sales Operations</p>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Đang kiểm tra kết nối…</span></div>
  </header>

  <div id="messages"></div>

  <div class="quick">
    <button data-prompt="Báo cáo hôm nay">📋 Báo cáo hôm nay</button>
    <button data-prompt="Báo cáo tuần này">📊 Báo cáo tuần</button>
    <button data-prompt="Bạn có thể giúp tôi những gì?">❓ Hướng dẫn</button>
  </div>

  <footer>
    <div class="toolbar">
      <span class="hint">Enter để gửi · Shift+Enter để xuống dòng</span>
      <button class="clear-btn" id="clearBtn">Xóa hội thoại</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Nhập tin nhắn hoặc dán dữ liệu task vào đây…"></textarea>
      <button class="send-btn" id="sendBtn">Gửi</button>
    </div>
  </footer>
</div>

<!-- Markdown renderer (optional; falls back to plain text if it can't load) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const ENDPOINT = "https://endpoint-a2e9ba08-56ff-4c4f-9a5f-70490afdb8fa.agentbase-runtime.aiplatform.vngcloud.vn";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const clearBtn = document.getElementById("clearBtn");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  // Conversation history sent to the agent for context (role/content turns).
  let history = [];
  let busy = false;

  // --- Rendering helpers ---
  function renderContent(text, isBot) {
    if (isBot && window.marked) {
      try { return marked.parse(text); } catch (e) { /* fall through */ }
    }
    // Plain text fallback (escaped; white-space: pre-wrap keeps line breaks)
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function addBubble(text, who, opts = {}) {
    const row = document.createElement("div");
    row.className = "row " + (who === "user" ? "user" : "bot");
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (opts.error ? " error" : "");
    if (opts.html) {
      bubble.innerHTML = opts.html;
    } else {
      bubble.innerHTML = renderContent(text, who === "bot");
    }
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "typingRow";
    row.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function removeTyping() {
    const r = document.getElementById("typingRow");
    if (r) r.remove();
  }

  // --- Send a message ---
  async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    autoGrow();

    addBubble(text, "user");
    addTyping();

    try {
      const res = await fetch(ENDPOINT + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history: history.slice(-12), // keep recent context only
        }),
      });

      removeTyping();

      if (!res.ok) {
        let detail = "Lỗi máy chủ (HTTP " + res.status + ")";
        try { const j = await res.json(); if (j.detail) detail = j.detail; } catch (e) {}
        addBubble("⚠️ " + detail, "bot", { error: true });
        return;
      }

      const data = await res.json();
      const reply = (data.reply || "").trim() || "(không có nội dung trả về)";
      addBubble(reply, "bot");

      // Update context history
      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      removeTyping();
      addBubble(
        "⚠️ Không kết nối được tới agent. Kiểm tra mạng hoặc endpoint.\n(" + err.message + ")",
        "bot",
        { error: true }
      );
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // --- Health check ---
  async function checkHealth() {
    try {
      const res = await fetch(ENDPOINT + "/health");
      if (res.ok) {
        statusEl.className = "status ok";
        statusText.textContent = "Đã kết nối · sẵn sàng";
      } else {
        throw new Error("status " + res.status);
      }
    } catch (e) {
      statusEl.className = "status err";
      statusText.textContent = "Không kết nối được tới agent";
    }
  }

  // --- UI wiring ---
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  }
  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send(inputEl.value);
    }
  });
  sendBtn.addEventListener("click", () => send(inputEl.value));
  clearBtn.addEventListener("click", () => {
    history = [];
    messagesEl.innerHTML = "";
    greet();
  });
  document.querySelectorAll(".quick button").forEach((b) => {
    b.addEventListener("click", () => send(b.dataset.prompt));
  });

  function greet() {
    addBubble(
      "Xin chào! 👋 Tôi là trợ lý phân tích task của team SO.\n\n" +
      "Bạn có thể:\n" +
      "• Dán dữ liệu task để tôi phân tích\n" +
      "• Bấm **📋 Báo cáo hôm nay** hoặc **📊 Báo cáo tuần**\n" +
      "• Hỏi *\"PIC [tên]\"* để xem task của một người\n\n" +
      "Tôi cần hỗ trợ gì cho bạn hôm nay?",
      "bot"
    );
  }

  greet();
  checkHealth();
  inputEl.focus();
</script>
</body>
</html>
